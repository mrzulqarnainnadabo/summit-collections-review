name: Storefront browser QA

on:
  push:
    branches:
      - feat/founder-catalogue-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/summit-http.log 2>&1 &
          echo $! > /tmp/summit-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/summit-http.log
          exit 1
      - name: Run responsive and interaction tests
        run: npx playwright test tests/storefront.spec.cjs --workers=1 --reporter=list
      - name: Upload browser screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-storefront-browser-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
