name: Import founder product assets

on:
  workflow_dispatch:
  push:
    branches:
      - feat/founder-catalogue-foundation
    paths:
      - "assets/summit-founder-review-assets.zip"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feat/founder-catalogue-foundation
          persist-credentials: true

      - name: Extract approved product derivatives
        run: |
          set -euo pipefail
          test -f assets/summit-founder-review-assets.zip
          mkdir -p /tmp/summit-assets
          unzip -tq assets/summit-founder-review-assets.zip
          unzip -q assets/summit-founder-review-assets.zip -d /tmp/summit-assets
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/summit-assets")
          manifest_path = root / "MANIFEST.json"
          assert manifest_path.is_file(), "Asset manifest is missing"
          manifest = json.loads(manifest_path.read_text())
          products = manifest.get("products", [])
          assert len(products) == 14, "Expected exactly 14 approved product derivatives"
          expected = {f"SC-{i:03d}" for i in range(1, 15)}
          assert {p.get("id") for p in products} == expected, "Manifest product IDs are incomplete or unexpected"
          assert len({p.get("asset") for p in products}) == 14, "Manifest asset paths must be unique"

          def vp8_dimensions(data, asset):
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"Not a valid WebP container: {asset}"
              assert data[12:16] == b"VP8 ", f"Unexpected WebP encoding; expected approved lossy VP8 derivative: {asset}"
              assert data[23:26] == b"\x9d\x01\x2a", f"Invalid VP8 frame header: {asset}"
              width = int.from_bytes(data[26:28], "little") & 0x3fff
              height = int.from_bytes(data[28:30], "little") & 0x3fff
              return [width, height]

          destination = Path("products")
          destination.mkdir(exist_ok=True)
          for product in products:
              asset = product.get("asset", "")
              assert asset == f"products/{product['id'].lower()}.webp", f"Unexpected asset path: {asset}"
              source = root / asset
              data = source.read_bytes()
              assert len(data) == product.get("bytes"), f"Byte count mismatch: {asset}"
              assert len(data) > 1000, f"Suspiciously small image: {asset}"
              dimensions = vp8_dimensions(data, asset)
              assert dimensions == product.get("dimensions"), f"Dimension mismatch for {asset}: {dimensions} != {product.get('dimensions')}"
              if product["id"] == "SC-010":
                  assert product.get("view") == "back", "SC-010 must remain back-view-only"
              (destination / source.name).write_bytes(data)

          actual = {p.name for p in destination.glob("sc-*.webp")}
          assert actual == {f"sc-{i:03d}.webp" for i in range(1, 15)}, "Imported image set is incomplete or contains unexpected files"
          print("Validated 14 manifest-matched WebP derivatives, byte sizes and dimensions.")
          PY

      - name: Commit prepared derivatives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/sc-*.webp
          git rm assets/summit-founder-review-assets.zip
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "assets: add founder-approved product image derivatives"
          git push origin HEAD:feat/founder-catalogue-foundation
