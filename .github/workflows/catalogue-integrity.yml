name: Catalogue integrity

on:
  push:
    branches:
      - feat/founder-catalogue-foundation
      - feat/summit-flagship-v3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/verify-catalogue.mjs
          node --check scripts/verify-storefront-contract.mjs
      - name: Verify catalogue provenance and publication rules
        run: node scripts/verify-catalogue.mjs
      - name: Require all published product images on the development branch
        run: node scripts/verify-catalogue.mjs --require-assets
      - name: Verify storefront integration and accessibility contract
        run: node scripts/verify-storefront-contract.mjs

  verify-release-assets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require all published product images before release review
        run: node scripts/verify-catalogue.mjs --require-assets
